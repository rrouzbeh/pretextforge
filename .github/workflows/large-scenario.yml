name: enterprise scenario
on: workflow_dispatch
permissions:
  contents: read
jobs:
  enterprise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --group dev
      - run: uv run python scripts/test_large_scenario.py --output output/enterprise-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enterprise-test-results
          retention-days: 7
          path: |
            output/enterprise-test/summary.*
            output/enterprise-test/*/quality_report.*
