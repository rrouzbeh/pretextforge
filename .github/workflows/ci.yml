name: checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run pforge generate scenarios/acme.yaml --output output/complete
      - run: uv run pforge generate scenarios/acme.yaml --profile degraded --output output/degraded
      - run: uv run pforge eval output/degraded
      - run: uv run pforge generate scenarios/llm-pilot.yaml --text-mode cached_llm --render-cache examples/llm-pilot-cache --output output/cached-pilot
      - run: uv run pforge eval output/cached-pilot
