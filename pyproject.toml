[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pretextforge"
version = "0.3.1"
description = "Scenario-based synthetic events for testing social-engineering detection"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6,<7"]

[project.scripts]
pforge = "pretextforge.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["packaged: requires the freshly generated real-model example caches"]
